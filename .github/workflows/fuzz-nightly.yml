# Nightly differential fuzzing of JuliaInterpreter (fuzz/, NEXT.md item 7).
#
# Three lanes (campaigns run at -O1 — faster, and it sidesteps the codegen-
# induced GC-corruption crash; see fuzz/longrun.sh):
#   - '1.12' (required): the supported Julia. New findings turn this lane red.
#   - 'pre' (continue-on-error): the upcoming release (RC/beta).
#   - 'nightly' (continue-on-error): Julia master — earliest warning of an
#     interpreter break or a codegen/GC regression.
# The forward lanes are advisory: JuliaInterpreter's bug density historically
# concentrates on new Julias, so a red pre/nightly lane is early warning of
# upcoming breakage, not a bug in current code. The selftest is a support gate:
# if the harness does not pass on a lane's Julia, the job stops there, so
# campaign findings are never produced on an unsupported Julia.
#
# Findings (fuzz/findings/ is gitignored, so a checkout starts empty), the
# longrun logs and any crash-journal evidence are always uploaded as artifacts;
# the job then fails iff the findings directory gained entries.
name: Fuzz nightly
on:
  # Nightly cron disabled: at the current harness maturity the campaigns
  # re-derive only known upstream-Julia divergences (the Bool i1-vs-i8
  # intrinsic family, _svec_ref specialization, compilerbarrier
  # invalid-setting UB — see fuzz/NEXT.md's upstream shortlist), so the
  # standing schedule was spending CI on noise. Re-enable by uncommenting the
  # schedule block once the call axis gains three-way adjudication (NEXT.md
  # follow-up #1) so it stops reporting non-interpreter divergences.
  # schedule:
  #   - cron: '17 3 * * *'   # 03:17 UTC, off-peak
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: 'Campaign duration passed to fuzz/longrun.sh (seconds)'
        required: false
        default: '10800'
permissions:
  contents: read
concurrency:
  group: fuzz-nightly-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fuzz:
    name: Fuzz Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    # Only the supported release lane (1.12) is required; the forward-looking
    # lanes are advisory early warning, so their failures never fail the workflow.
    continue-on-error: ${{ matrix.version != '1.12' }}
    # The campaign step's own backstop caps it at duration (default 3 h)
    # + 45 min; setup/selftest/upload fit in the remainder with hours to
    # spare, so hitting this job limit again would mean the backstop broke.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.12'      # required lane, the supported release
          - 'pre'       # early warning: the upcoming release (RC/beta)
          - 'nightly'   # earliest warning: Julia master, where a GC/codegen
                        # regression or an interpreter break shows up first
    steps:
      - uses: actions/checkout@v7
        with:
          # The fuzzing harness lives on this branch; master has no fuzz/ yet.
          # Drop this pin (checkout default) once the branch merges.
          ref: claude/false-positive-fussing-improvements-igts2c
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - name: Instantiate the fuzz environment
        run: julia --project=fuzz -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()'
      - name: Support gate (fuzz selftest)
        # A failure here ends the job before any campaign runs: on 'pre'/'nightly'
        # that means "this Julia is not supported yet", and continue-on-error
        # keeps the workflow green while the lane itself is marked failed.
        run: julia --project=fuzz fuzz/run.jl --selftest
      - name: Snapshot findings
        id: snapshot
        run: |
          mkdir -p fuzz/findings
          ls -1 fuzz/findings | sort > "$RUNNER_TEMP/findings-before.txt"
      - name: Run fuzzing campaign
        env:
          DURATION: ${{ inputs.duration_seconds || '10800' }}
          # github.run_number is monotonic per run. GitHub Actions expressions
          # have no arithmetic, so the disjoint-band offset is applied in shell
          # below, not here.
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          # Distinct per-run seed offset so each night explores NEW programs
          # instead of re-testing the same sequence. The +1000000 band sits
          # above local runs' default (bash $RANDOM, 0..32767) so CI and laptop
          # campaigns never overlap. All matrix lanes share this base on
          # purpose: the Julia versions test identical programs, so the only
          # variable is the Julia version.
          export SEED_BASE=$(( 1000000 + RUN_NUMBER ))
          # Hard wall-clock backstop: DURATION plus 45 min of slack for the
          # last batches to drain. longrun.sh bounds itself (deadline between
          # batches, timeout -k per batch), but the one time it did not — run
          # #8's nightly lane, where a wedged julia ignored the un-escalated
          # per-batch TERM — the campaign ran 5h48 into the job's 6 h limit and
          # the whole job was cancelled with the findings uploaded but never
          # reported. The backstop converts that worst case into a truncated
          # campaign whose findings still flow through the report + fail gate.
          rc=0
          timeout -k 60 $(( DURATION + 2700 )) ./fuzz/longrun.sh "$DURATION" || rc=$?
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            echo "::warning::campaign hit the wall-clock backstop (exit $rc); reporting what it found"
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi
      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings-julia-${{ matrix.version }}
          path: fuzz/findings/
          if-no-files-found: ignore
      - name: Upload longrun logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-longrun-logs-julia-${{ matrix.version }}
          path: fuzz/longrun/
          if-no-files-found: ignore
      - name: Upload crash journals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-journals-julia-${{ matrix.version }}
          path: fuzz/journal-*/crashed/
          if-no-files-found: ignore
      - name: Report new findings
        # Each finding's meta.md carries the full shrunk program, the seed, and
        # the divergence detail — everything needed to analyse it. Printing them
        # here makes findings readable from the job log alone (via the GitHub
        # API), so they can be triaged even when the uploaded artifacts are not
        # reachable. The repro.jl is dumped too for a copy-paste reproducer.
        # This runs before the fail gate so it always executes; the gate below
        # is what turns the lane red.
        #
        # always(): run #8's nightly lane was cancelled at the job limit and
        # this step was skipped — findings uploaded but unreadable from the
        # log. As long as the snapshot exists there is something to diff, no
        # matter how the campaign step ended.
        if: ${{ always() && steps.snapshot.outcome == 'success' }}
        run: |
          ls -1 fuzz/findings | sort > "$RUNNER_TEMP/findings-after.txt"
          comm -13 "$RUNNER_TEMP/findings-before.txt" "$RUNNER_TEMP/findings-after.txt" \
            > "$RUNNER_TEMP/new-findings.txt"
          while IFS= read -r d; do
            [ -n "$d" ] || continue
            echo "::group::FINDING $d"
            echo "----- fuzz/findings/$d/meta.md -----"
            cat "fuzz/findings/$d/meta.md" 2>/dev/null || echo "(no meta.md)"
            echo "----- fuzz/findings/$d/repro.jl -----"
            cat "fuzz/findings/$d/repro.jl" 2>/dev/null || echo "(no repro.jl)"
            echo "::endgroup::"
          done < "$RUNNER_TEMP/new-findings.txt"
      - name: Fail on new findings
        run: |
          if [ -s "$RUNNER_TEMP/new-findings.txt" ]; then
            echo "New findings:"
            cat "$RUNNER_TEMP/new-findings.txt"
            exit 1
          fi
          echo "No new findings."
